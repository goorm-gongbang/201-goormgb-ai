static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: backend
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: true
                      http_service:
                        server_uri:
                          uri: http://authz-adapter:9001
                          cluster: ext_authz
                          timeout: 0.8s
                        path_prefix: /check
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: x-session-id
                              - exact: x-trace-id
                              - exact: user-agent
                              - exact: x-forwarded-for
                              - exact: cookie
                              - exact: x-flow-state
                              - exact: x-defense-tier
                              - exact: x-repetitive-pattern-count
                              - exact: x-challenge-fail-count
                              - exact: x-token-mismatch
                              - exact: :path
                              - exact: :method
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - prefix: x-defense-
                              - exact: x-throttle-ms
                              - exact: x-gate-mode
                          allowed_client_headers:
                            patterns:
                              - prefix: x-defense-
                              - exact: x-throttle-ms
                              - exact: x-gate-mode
                              - exact: x-block-reason
                          allowed_client_headers_on_success:
                            patterns:
                              - prefix: x-defense-
                              - exact: x-throttle-ms
                              - exact: x-gate-mode
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: backend
      connect_timeout: 1s
      type: LOGICAL_DNS
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 8080

    - name: ext_authz
      connect_timeout: 1s
      type: LOGICAL_DNS
      load_assignment:
        cluster_name: ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: authz-adapter
                      port_value: 9001

admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
