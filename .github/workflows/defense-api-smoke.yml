name: "Defense API smoke test"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "src/traffic_master_ai/defense/**"
      - ".github/workflows/defense-api-smoke.yml"
  workflow_dispatch:

jobs:
  defense-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build defense API image
        run: |
          docker build \
            -f src/traffic_master_ai/defense/api/Dockerfile \
            -t tm-ai-defense:ci \
            .

      - name: Run defense API container
        run: |
          docker run -d \
            --name tm-ai-defense-ci \
            -p 18000:8000 \
            -e TM_RUNTIME_STATE_BACKEND=memory \
            tm-ai-defense:ci
          sleep 2
          docker ps -a --filter name=tm-ai-defense-ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 20); do
            if [ -z "$(docker ps --filter name=tm-ai-defense-ci --format '{{.Names}}')" ]; then
              echo "Defense API container exited before health check"
              docker ps -a --filter name=tm-ai-defense-ci || true
              docker inspect tm-ai-defense-ci || true
              docker logs tm-ai-defense-ci || true
              exit 1
            fi

            if curl -fsS http://localhost:18000/healthz; then
              exit 0
            fi
            sleep 2
          done

          echo "Defense API health check failed"
          docker ps -a --filter name=tm-ai-defense-ci || true
          docker inspect tm-ai-defense-ci || true
          docker logs tm-ai-defense-ci || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker ps -a --filter name=tm-ai-defense-ci || true
          docker logs tm-ai-defense-ci || true
          docker stop tm-ai-defense-ci || true
          docker rm tm-ai-defense-ci || true
