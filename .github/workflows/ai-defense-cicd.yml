name: AI Defense CI/CD (dev, staging, prod)

on:
  push:
    branches:
      - dev
      - staging
      - prod
    paths:
      - ".github/workflows/ai-defense-cicd.yml"
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - "spec/delivery_bundle_2026-03-04/CI/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-smoke-push:
    runs-on: ubuntu-latest
    env:
      CONTAINER_PORT: "8000"
      SMOKE_PORT: "18000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build target and image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          case "$BRANCH" in
            dev|staging|prod) TARGET_ENV="$BRANCH" ;;
            *)
              echo "Unsupported branch for this workflow: $BRANCH"
              exit 1
              ;;
          esac

          if [ -f "src/traffic_master_ai/defense/api/Dockerfile" ]; then
            DOCKERFILE_PATH="src/traffic_master_ai/defense/api/Dockerfile"
          elif [ -f "spec/delivery_bundle_2026-03-04/CI/Dockerfile.ai-defense" ]; then
            DOCKERFILE_PATH="spec/delivery_bundle_2026-03-04/CI/Dockerfile.ai-defense"
          else
            echo "No AI defense Dockerfile found."
            echo "Expected one of:"
            echo "- src/traffic_master_ai/defense/api/Dockerfile"
            echo "- spec/delivery_bundle_2026-03-04/CI/Dockerfile.ai-defense"
            exit 1
          fi

          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_LC="$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REPO="ghcr.io/${OWNER_LC}/${REPO_LC}-ai-defense"
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          IMAGE_SHA_TAG="${IMAGE_REPO}:${TARGET_ENV}-${SHA_SHORT}"
          IMAGE_ENV_LATEST_TAG="${IMAGE_REPO}:${TARGET_ENV}-latest"

          echo "target_env=${TARGET_ENV}" >> "${GITHUB_OUTPUT}"
          echo "dockerfile_path=${DOCKERFILE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "image_repo=${IMAGE_REPO}" >> "${GITHUB_OUTPUT}"
          echo "image_sha_tag=${IMAGE_SHA_TAG}" >> "${GITHUB_OUTPUT}"
          echo "image_env_latest_tag=${IMAGE_ENV_LATEST_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f "${{ steps.meta.outputs.dockerfile_path }}" \
            -t "${{ steps.meta.outputs.image_sha_tag }}" \
            -t "${{ steps.meta.outputs.image_env_latest_tag }}" \
            .

      - name: Smoke test (/healthz)
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_NAME="ai-defense-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -e CI=true \
            -p "${SMOKE_PORT}:${CONTAINER_PORT}" \
            "${{ steps.meta.outputs.image_sha_tag }}"

          for i in $(seq 1 30); do
            if ! docker ps --filter "name=^/${CONTAINER_NAME}$" --filter "status=running" --format "{{.Names}}" | grep -q .; then
              echo "Container exited before healthz became ready."
              break
            fi
            if curl -fsS "http://127.0.0.1:${SMOKE_PORT}/healthz" >/dev/null 2>&1; then
              echo "Healthz check passed."
              exit 0
            fi
            sleep 1
          done

          echo "Healthz check failed. Container status:"
          docker ps -a --filter "name=^/${CONTAINER_NAME}$" || true
          echo "Container logs:"
          docker logs "${CONTAINER_NAME}" || true
          exit 1

      - name: Login to GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.meta.outputs.image_sha_tag }}"
          docker push "${{ steps.meta.outputs.image_env_latest_tag }}"

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "## AI Defense CI/CD Result"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Target env: \`${{ steps.meta.outputs.target_env }}\`"
            echo "- Dockerfile: \`${{ steps.meta.outputs.dockerfile_path }}\`"
            echo "- Image (sha): \`${{ steps.meta.outputs.image_sha_tag }}\`"
            echo "- Image (latest): \`${{ steps.meta.outputs.image_env_latest_tag }}\`"
            echo ""
            echo "Cloud Helm values should reference the env-latest tag for each branch."
          } >> "${GITHUB_STEP_SUMMARY}"
