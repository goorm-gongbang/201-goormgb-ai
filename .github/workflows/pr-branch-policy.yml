name: "PR branch policy (promotion: dev -> staging -> prod)"

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

jobs:
  validate-pr-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR base/head branch policy
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          HEAD="${{ github.event.pull_request.head.ref }}"

          echo "BASE=$BASE"
          echo "HEAD=$HEAD"

          # Allow any PR targeting dev (feat/fix/etc -> dev)
          if [ "$BASE" = "dev" ]; then
            echo "✅ Allowed: PR targets dev."
            exit 0
          fi

          # Allow dev -> staging only
          if [ "$BASE" = "staging" ]; then
            if [ "$HEAD" = "dev" ]; then
              echo "✅ Allowed: dev -> staging."
              exit 0
            fi
            echo "❌ Blocked: Only dev -> staging PRs are allowed."
            echo "👉 Please merge into 'dev' first, then promote to 'staging'."
            exit 1
          fi

          # Allow staging -> prod only
          if [ "$BASE" = "prod" ]; then
            if [ "$HEAD" = "staging" ]; then
              echo "✅ Allowed: staging -> prod."
              exit 0
            fi
            echo "❌ Blocked: Only staging -> prod PRs are allowed."
            echo "👉 Please merge into 'staging' first, then promote to 'prod'."
            exit 1
          fi

          # Block everything else (e.g., feat -> feat, direct -> main)
          echo "❌ Blocked: PR base must be one of dev/staging/prod."
          exit 1
