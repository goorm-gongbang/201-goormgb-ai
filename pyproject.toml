[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traffic-master-ai"
version = "0.1.0"
description = "Traffic Master AI Domain - Attack & Defense PoC-0"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "goorm-gongbang" }
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]
attack_mvp = [
    "langgraph>=1.0.0",
    "playwright>=1.42.0",
]
defense_api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "redis>=5.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "PyJWT>=2.9.0",
    "boto3>=1.34.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
tm-ai-etl = "traffic_master_ai.defense.api.etl_worker:run_etl"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_master_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
