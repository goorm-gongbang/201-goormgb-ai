openapi: 3.1.0
info:
  title: Traffic Master AI Defense API
  description: Deterministic defense runtime API for ext_authz adapter integration.
    Includes evaluate + challenge start/verify/event contracts.
  version: v2
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags:
      - health
      summary: Readyz
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /runtime/{session_id}:
    get:
      tags:
      - state
      summary: Runtime State
      operationId: runtime_state_runtime__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStateSnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluate:
    post:
      tags:
      - decision
      summary: Evaluate
      operationId: evaluate_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /challenge/start:
    post:
      tags:
      - challenge
      summary: Challenge Start
      operationId: challenge_start_challenge_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /challenge/event:
    post:
      tags:
      - challenge
      summary: Challenge Event
      operationId: challenge_event_challenge_event_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeEventIngestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeEventIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /challenge/verify:
    post:
      tags:
      - challenge
      summary: Challenge Verify
      operationId: challenge_verify_challenge_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /meta/storage:
    get:
      tags:
      - state
      summary: Storage Meta
      operationId: storage_meta_meta_storage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Storage Meta Meta Storage Get
components:
  schemas:
    ChallengeEventIngestRequest:
      properties:
        session_id:
          type: string
          minLength: 1
          title: Session Id
        challenge_id:
          type: string
          minLength: 1
          title: Challenge Id
        challenge_token:
          type: string
          minLength: 1
          title: Challenge Token
        events:
          items:
            $ref: '#/components/schemas/ChallengePointerEvent'
          type: array
          title: Events
      additionalProperties: false
      type: object
      required:
      - session_id
      - challenge_id
      - challenge_token
      title: ChallengeEventIngestRequest
      description: Raw challenge events upload.
    ChallengeEventIngestResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        challenge_id:
          type: string
          title: Challenge Id
        accepted_events:
          type: integer
          title: Accepted Events
        total_events:
          type: integer
          title: Total Events
      additionalProperties: false
      type: object
      required:
      - session_id
      - challenge_id
      - accepted_events
      - total_events
      title: ChallengeEventIngestResponse
      description: Accepted event count response.
    ChallengePointerEvent:
      properties:
        t_ms:
          type: integer
          minimum: 0.0
          title: T Ms
        x:
          type: number
          title: X
        y:
          type: number
          title: Y
        event:
          type: string
          enum:
          - down
          - move
          - up
          - click
          title: Event
      additionalProperties: false
      type: object
      required:
      - t_ms
      - x
      - y
      - event
      title: ChallengePointerEvent
      description: Raw client pointer event used for server-side verification.
    ChallengeStartRequest:
      properties:
        session_id:
          type: string
          minLength: 1
          title: Session Id
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        flow_state:
          anyOf:
          - type: string
            enum:
            - S0
            - S1
            - S2
            - S3
            - S4
            - S4R
            - S5
            - S5R
            - S6
            - SX
          - type: 'null'
          title: Flow State
        challenge_type:
          type: string
          enum:
          - queue_gate
          - catch_ball
          title: Challenge Type
          default: catch_ball
      additionalProperties: false
      type: object
      required:
      - session_id
      title: ChallengeStartRequest
      description: Start a one-time challenge gate.
    ChallengeStartResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        challenge_id:
          type: string
          title: Challenge Id
        challenge_type:
          type: string
          enum:
          - queue_gate
          - catch_ball
          title: Challenge Type
        challenge_token:
          type: string
          title: Challenge Token
        issued_at_ms:
          type: integer
          title: Issued At Ms
        expires_at_ms:
          type: integer
          title: Expires At Ms
        attempt_limit:
          type: integer
          title: Attempt Limit
        public_params:
          additionalProperties:
            anyOf:
            - type: number
            - type: integer
            - type: string
            - type: boolean
          type: object
          title: Public Params
      additionalProperties: false
      type: object
      required:
      - session_id
      - challenge_id
      - challenge_type
      - challenge_token
      - issued_at_ms
      - expires_at_ms
      - attempt_limit
      - public_params
      title: ChallengeStartResponse
      description: Challenge issuance response.
    ChallengeVerifyRequest:
      properties:
        session_id:
          type: string
          minLength: 1
          title: Session Id
        challenge_id:
          type: string
          minLength: 1
          title: Challenge Id
        challenge_token:
          type: string
          minLength: 1
          title: Challenge Token
        final_click_ts_ms:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Final Click Ts Ms
      additionalProperties: false
      type: object
      required:
      - session_id
      - challenge_id
      - challenge_token
      title: ChallengeVerifyRequest
      description: Challenge verification request.
    ChallengeVerifyResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        challenge_id:
          type: string
          title: Challenge Id
        result:
          type: string
          enum:
          - PASSED
          - FAILED
          - BLOCKED
          - EXPIRED
          title: Result
        passed:
          type: boolean
          title: Passed
        attempts_used:
          type: integer
          title: Attempts Used
        attempts_left:
          type: integer
          title: Attempts Left
        defense_tier:
          type: string
          enum:
          - T0
          - T1
          - T2
          - T3
          title: Defense Tier
        action:
          type: string
          enum:
          - NONE
          - CHALLENGE
          - THROTTLE
          - GATE
          - BLOCK
          title: Action
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        headers_to_add:
          additionalProperties:
            type: string
          type: object
          title: Headers To Add
      additionalProperties: false
      type: object
      required:
      - session_id
      - challenge_id
      - result
      - passed
      - attempts_used
      - attempts_left
      - defense_tier
      - action
      title: ChallengeVerifyResponse
      description: Server-side verification result.
    EvaluateRequest:
      properties:
        session_id:
          type: string
          minLength: 1
          title: Session Id
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        path:
          type: string
          minLength: 1
          title: Path
        method:
          type: string
          minLength: 1
          title: Method
          description: HTTP method such as GET/POST
        timestamp:
          type: integer
          minimum: 0.0
          title: Timestamp
          description: Unix epoch milliseconds
        headers:
          additionalProperties:
            type: string
          type: object
          title: Headers
        flow_state:
          anyOf:
          - type: string
            enum:
            - S0
            - S1
            - S2
            - S3
            - S4
            - S4R
            - S5
            - S5R
            - S6
            - SX
          - type: 'null'
          title: Flow State
        defense_tier:
          anyOf:
          - type: string
            enum:
            - T0
            - T1
            - T2
            - T3
          - type: 'null'
          title: Defense Tier
        challenge_fail_count:
          type: integer
          minimum: 0.0
          title: Challenge Fail Count
          default: 0
        repetitive_pattern_count:
          type: integer
          minimum: 0.0
          title: Repetitive Pattern Count
          default: 0
        token_mismatch:
          type: boolean
          title: Token Mismatch
          default: false
        signals:
          items:
            type: string
          type: array
          title: Signals
        telemetry_features:
          anyOf:
          - $ref: '#/components/schemas/EvaluateTelemetryFeatures'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - session_id
      - path
      - method
      - timestamp
      title: EvaluateRequest
      description: Adapter -> AI defense decision request.
    EvaluateResponse:
      properties:
        allow:
          type: boolean
          title: Allow
        session_id:
          type: string
          title: Session Id
        flow_state:
          type: string
          enum:
          - S0
          - S1
          - S2
          - S3
          - S4
          - S4R
          - S5
          - S5R
          - S6
          - SX
          title: Flow State
        defense_tier:
          type: string
          enum:
          - T0
          - T1
          - T2
          - T3
          title: Defense Tier
        action:
          type: string
          enum:
          - NONE
          - CHALLENGE
          - THROTTLE
          - GATE
          - BLOCK
          title: Action
        actions:
          items:
            type: string
            enum:
            - NONE
            - CHALLENGE
            - THROTTLE
            - GATE
            - BLOCK
          type: array
          title: Actions
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        rule_hits:
          items:
            type: string
          type: array
          title: Rule Hits
        risk_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Risk Score
        policy_version:
          type: string
          title: Policy Version
          default: def-pol-2.0.0
        headers_to_add:
          additionalProperties:
            type: string
          type: object
          title: Headers To Add
        decision_id:
          type: string
          title: Decision Id
        latency_ms:
          type: integer
          minimum: 0.0
          title: Latency Ms
        version:
          type: string
          title: Version
          default: v2
      additionalProperties: false
      type: object
      required:
      - allow
      - session_id
      - flow_state
      - defense_tier
      - action
      - decision_id
      - latency_ms
      title: EvaluateResponse
      description: AI defense decision response consumed by authz adapter.
    EvaluateTelemetryFeatures:
      properties:
        totalDist:
          anyOf:
          - type: number
          - type: 'null'
          title: Totaldist
        linearDist:
          anyOf:
          - type: number
          - type: 'null'
          title: Lineardist
        linearityRatio:
          anyOf:
          - type: number
          - type: 'null'
          title: Linearityratio
        avgVelocity:
          anyOf:
          - type: number
          - type: 'null'
          title: Avgvelocity
        tremorStdDev:
          anyOf:
          - type: number
          - type: 'null'
          title: Tremorstddev
        dwellTime:
          anyOf:
          - type: number
          - type: 'null'
          title: Dwelltime
        timestamp:
          anyOf:
          - type: integer
          - type: 'null'
          title: Timestamp
      additionalProperties: false
      type: object
      title: EvaluateTelemetryFeatures
      description: Telemetry summary features for a single trigger window.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
        service:
          type: string
          title: Service
        version:
          type: string
          title: Version
      type: object
      required:
      - status
      - service
      - version
      title: HealthResponse
      description: Basic liveness/readiness response.
    RuntimeStateSnapshot:
      properties:
        flow_state:
          type: string
          enum:
          - S0
          - S1
          - S2
          - S3
          - S4
          - S4R
          - S5
          - S5R
          - S6
          - SX
          title: Flow State
          default: S0
        defense_tier:
          type: string
          enum:
          - T0
          - T1
          - T2
          - T3
          title: Defense Tier
          default: T0
        risk_score:
          type: number
          title: Risk Score
          default: 0.0
        challenge_fail_count:
          type: integer
          title: Challenge Fail Count
          default: 0
        seat_taken_streak:
          type: integer
          title: Seat Taken Streak
          default: 0
        hold_fail_streak:
          type: integer
          title: Hold Fail Streak
          default: 0
        heavy_budget_left:
          type: integer
          title: Heavy Budget Left
          default: 2
        replan_budget_left:
          type: integer
          title: Replan Budget Left
          default: 3
        probation_until_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Probation Until Ms
        policy_version:
          type: string
          title: Policy Version
          default: def-pol-2.0.0
        updated_ts_ms:
          type: integer
          title: Updated Ts Ms
          default: 0
        vqa_required:
          type: boolean
          title: Vqa Required
          default: true
        vqa_passed:
          type: boolean
          title: Vqa Passed
          default: false
        vqa_attempt_count:
          type: integer
          title: Vqa Attempt Count
          default: 0
        vqa_retry_limit:
          type: integer
          title: Vqa Retry Limit
          default: 2
        vqa_last_result:
          anyOf:
          - type: string
            enum:
            - PASSED
            - FAILED
            - BLOCKED
            - EXPIRED
          - type: 'null'
          title: Vqa Last Result
        active_challenge_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Challenge Id
        active_challenge_expires_at_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Active Challenge Expires At Ms
      additionalProperties: false
      type: object
      title: RuntimeStateSnapshot
      description: Runtime session state kept in Redis (or in-memory fallback).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
