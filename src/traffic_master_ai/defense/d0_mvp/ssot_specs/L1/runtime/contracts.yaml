# Specs/Defense/L1/runtime/contracts.yaml
# Defense Runtime Contracts SSOT (L1)
# v1.0.0 — Spec Driven Development(SDD)용 “런타임 공통 계약” 권위 문서
#
# 목적:
# - 방어 런타임에서 공통으로 사용하는 헤더/응답/에러 바디/ReasonCode/HTTP 매핑을 정의한다.
# - Envoy ext_authz ↔ Adapter(/check/*) ↔ AI(/evaluate) ↔ FE/BE 사이에서 흔들리기 쉬운 계약을 한 곳에 고정한다.
#
# 주의:
# - 본 문서는 L1 SSOT이며, Annex는 설명서다.
# - L0의 불변 법칙(reasonCode 표준, stage 전이, 최소 audit 스키마)과 충돌하면 L1을 수정한다.

meta:
  doc_id: "l1_runtime_contracts"
  title: "Defense Runtime Contracts (L1)"
  version: "1.0.0"
  updated_at: "2026-03-08"
  timezone: "Asia/Seoul"
  owner_team: "defense-runtime"
  status: "draft"
  language: "ko"

governance:
  precedence: "L0 > L1 > L2 > annex"
  editing_rules:
    - "새로운 헤더/필드/HTTP 응답 코드를 추가/변경할 때는 본 문서를 먼저 수정한다."
    - "reasonCode 명명/HTTP 매핑은 L0 표준과 동일해야 한다."
  mvp_assumptions:
    runtime_llm_enabled: false
    honey_enabled: false
    gate_enabled: false
    sandbox_enabled: false
    s3_challenge_fixed: true
    throttle_enforcement: "Adapter delay injection"
    block_enforcement: "Envoy ext_authz deny(403) + persistence recommended"

# ==========================================================
# 1) 공통 헤더 계약
# ==========================================================
headers:
  required_in_all_defense_paths:
    X-Session-Id:
      type: string
      description: "세션 단위 식별자(모든 방어 판단/로그/상태 키의 기준)"
    X-Trace-Id:
      type: string
      description: "요청/이벤트 단위 추적 ID(dedup 및 audit 연결에 사용)"
  optional_in_all_defense_paths:
    X-Correlation-Id:
      type: string
      description: "프론트/플랫폼 상관관계 ID(있으면 audit에 기록)"
    Idempotency-Key:
      type: string
      description: "플랫폼 멱등성 키(플랫폼 API에서 사용). 방어 런타임은 참고만 할 수 있음."
    X-TM-TestMode:
      type: string
      description: "테스트 훅(있으면 test hook 규칙 적용 가능)"
  defense_response_headers:
    # Envoy/Adapter가 FE로 반환해야 하는 최소 메타
    x-defense-tier:
      type: string
      enum: [T0, T1, T2, T3]
      description: "방어 티어(Guard/EWMA 결과)"
    x-defense-action:
      type: string
      enum: [NONE, THROTTLE, REQUIRE_S3, BLOCK]
      description: "방어 액션(Planner 결과). REQUIRE_S3는 428을 의미."
    x-defense-policy-version:
      type: string
      description: "정책 버전(튜닝/롤백 추적용)"
    x-defense-throttle-ms:
      type: integer
      min: 0
      max: 2000
      description: "THROTTLE일 때 Adapter가 적용할 지연(ms). 미제공 시 tier 기본값 사용."
    x-defense-block-ttl-seconds:
      type: integer
      min: 1
      max: 86400
      description: "BLOCK 지속 TTL(초). 미제공 시 default(보통 session TTL) 사용."
  turnstile_headers_optional:
    # Turnstile token 전달 방식은 구현 선택. (turnstile_spec.yaml의 OQ-TS-1)
    X-Turnstile-Token:
      type: string
      description: "Turnstile 토큰(옵션). Adapter가 Cloudflare verify 수행에 사용."

# ==========================================================
# 2) reasonCode 및 HTTP 매핑(런타임에서 사용하는 범위)
#    - L0 표준을 준수해야 하며, L1에서는 사용 범위를 '선언'한다.
# ==========================================================
reason_codes:
  # MVP에서 런타임이 직접 생성/반환하는 reasonCode 중심
  enum:
    - BLOCKED
    - CHALLENGE_REQUIRED
    - INVALID_TRANSITION
    - CHALLENGE_FAILED
    - CHALLENGE_PASSED
    - CHALLENGE_TEMPORARILY_LOCKED
    - CHALLENGE_VERIFY_UNAVAILABLE
    - INTERNAL_ERROR
  http_mapping:
    # 기본 매핑(정책 표준)
    BLOCKED: { http_status: 403 }
    CHALLENGE_REQUIRED: { http_status: 428 }
    INVALID_TRANSITION: { http_status: 409 }
    CHALLENGE_TEMPORARILY_LOCKED: { http_status: 429 }
    INTERNAL_ERROR: { http_status: 500 }
  notes:
    - "CHALLENGE_REQUIRED(428)는 '갑툭튀 챌린지'가 아니라, S3 고정 단계 미통과 상태에서 S4/S5 요청이 왔을 때의 회귀 신호로만 사용한다."
    - "CHALLENGE_FAILED/PASSED는 verify API의 바디 reasonCode로 사용 가능(HTTP 200)."

# ==========================================================
# 3) 공통 응답 바디 스키마 (FE/Attack Agent/테스트에서 일관되게 해석)
# ==========================================================
schemas:
  ErrorResponse:
    type: object
    required: [status, reasonCode, message]
    properties:
      status:
        type: string
        enum: [FAIL]
      reasonCode:
        type: string
        enum_ref: "reason_codes.enum"
      message:
        type: string
      detail:
        type: object
        additionalProperties: true
        nullable: true
    description: "deny 응답(403/428/409/429 등)에서 사용되는 표준 에러 바디"

  OkResponse:
    type: object
    required: [status]
    properties:
      status:
        type: string
        enum: [OK]
      payload:
        type: object
        additionalProperties: true
        nullable: true

  # 방어 판단 결과(내부용) — Adapter/Envoy/FE에 헤더로 전달되는 값의 원형
  DefenseDecision:
    type: object
    required: [tier, action, policyVersion]
    properties:
      tier:
        type: string
        enum: [T0, T1, T2, T3]
      action:
        type: string
        enum: [NONE, THROTTLE, REQUIRE_S3, BLOCK]
      policyVersion:
        type: string
      throttleMs:
        type: integer
        nullable: true
      blockTtlSeconds:
        type: integer
        nullable: true
      reason:
        type: string
        nullable: true
    description: "AI 런타임 내부 판단 결과(최종적으로 x-defense-* 헤더로 직렬화)"

# ==========================================================
# 4) Envoy ext_authz ↔ Adapter(/check/*) 계약(최소형)
#    - Envoy의 실제 gRPC/HTTP ext_authz 포맷은 인프라 구현에 따라 다르므로,
#      L1에서는 'Adapter가 반드시 알아야 하는 최소 정보'만 고정한다.
# ==========================================================
envoy_ext_authz_adapter:
  endpoint:
    path_prefix: "/check/"
    methods: [POST]
  request_minimum:
    required_headers_ref: "headers.required_in_all_defense_paths"
    required_fields:
      upstreamPath:
        type: string
        description: "Envoy가 받은 원 요청 경로(Throttle 대상 판단/로그)"
      upstreamMethod:
        type: string
        description: "Envoy가 받은 원 요청 HTTP 메서드"
      flowState:
        type: string
        enum: [S0, S1, S2, S3, S4, S5, S6, SX]
        description: "현재 플로우 상태(Orchestrator/Planner 판단 입력)"
    optional_fields:
      original_query:
        type: string
        nullable: true
      client_ip_hash:
        type: string
        nullable: true
      turnstile_token:
        type: string
        nullable: true
        description: "X-Turnstile-Token을 바디로 전달하는 구현을 선택한 경우"
  response_contract:
    allow:
      description: "upstream(BE) 전달 허용"
      required_headers:
        - x-defense-tier
        - x-defense-action
        - x-defense-policy-version
      optional_headers:
        - x-defense-throttle-ms
    deny:
      description: "upstream 차단 및 즉시 응답"
      deny_status_supported:
        - 403 # BLOCKED
        - 428 # CHALLENGE_REQUIRED (S3 고정 미통과 회귀)
        - 409 # INVALID_TRANSITION
        - 429 # CHALLENGE_TEMPORARILY_LOCKED (S3 시도 초과)
      required_body_schema_ref: "schemas.ErrorResponse"
      required_headers:
        - x-defense-tier
        - x-defense-action
        - x-defense-policy-version

# ==========================================================
# 5) Adapter ↔ AI Defense Service(/evaluate) 계약
# ==========================================================
ai_evaluate:
  endpoint:
    method: POST
    path: "/evaluate"
  request:
    required_headers_ref: "headers.required_in_all_defense_paths"
    body:
      type: object
      required: [event, context]
      properties:
        event:
          type: object
          required: [eventType, tsMs, flowState]
          properties:
            eventType:
              type: string
              description: "L1/events.yaml의 enum 값을 사용"
            tsMs:
              type: integer
              format: int64
            flowState:
              type: string
              enum: [S0, S1, S2, S3, S4, S5, S6, SX]
            requestPath:
              type: string
              nullable: true
            requestMethod:
              type: string
              nullable: true
            s3Result:
              type: string
              enum: [PASS, FAIL, UNKNOWN]
              nullable: true
        context:
          type: object
          required: [policyVersion]
          properties:
            policyVersion:
              type: string
            # FE feature summary(요약) — raw trajectory 금지
            features:
              type: object
              additionalProperties: true
              nullable: true
            # Envoy/Adapter가 제공 가능한 메타
            meta:
              type: object
              additionalProperties: true
              nullable: true
  response:
    status: 200
    body_schema_ref: "schemas.DefenseDecision"
    headers:
      # Adapter가 Envoy로 넘길 x-defense-*를 그대로 제공해도 되고, Adapter가 변환해도 됨
      provides_x_defense_headers: true

# ==========================================================
# 6) S3 Challenge(고정 VQA) API 계약(요약)
#    - 상세는 annex/challenge_spec.yaml이 권위(Annex)이나,
#      L1에서는 엔드포인트/필수 필드 최소만 선언한다.
# ==========================================================
s3_challenge_api_minimum:
  issue:
    method: POST
    path: "/defense/challenge/issue"
    required_headers_ref: "headers.required_in_all_defense_paths"
    response:
      status: 200
      body:
        required:
          [challenge_id, game_id, issued_at_ms, expires_at_ms, public_params]
  verify:
    method: POST
    path: "/defense/challenge/verify"
    required_headers_ref: "headers.required_in_all_defense_paths"
    response:
      status: 200
      body:
        required: [result, reason_code, server_verdict]

# ==========================================================
# 7) 표준 해석 규칙(테스트/공격 에이전트/FE 공통)
# ==========================================================
interpretation:
  http_to_defense_outcome:
    rules:
      - when: "http_status == 403 OR reasonCode == 'BLOCKED'"
        outcome: "BLOCK"
      - when: "http_status == 428 OR reasonCode == 'CHALLENGE_REQUIRED'"
        outcome: "CHALLENGE"
      - when: "http_status in [409]"
        outcome: "INVALID_STATE"
      - when: "http_status in [429]"
        outcome: "COOLDOWN"
      - default:
        outcome: "PASS"
  notes:
    - "MVP에서 428은 S3 고정 미통과 회귀의 의미로만 사용한다."
    - "429는 S3 과도 실패/시도 초과에 대한 임시 락으로 사용한다."

# ==========================================================
# 8) 변경 관리(버전/호환성)
# ==========================================================
change_management:
  policy_version:
    header: "x-defense-policy-version"
    rule: "정책 변경 시 version bump 및 decision_audit에 기록"
  backward_compatibility:
    - "새 헤더/필드는 optional로 도입 후 rollout을 거쳐 required로 승격"
    - "ErrorResponse 스키마의 required 필드(status/reasonCode/message)는 변경 금지"

# ==========================================================
# 9) Open Questions (MVP 개발 전 고정 권장 항목)
#    - 문서 완성 후 open_questions.yaml로 통합 관리 예정
# ==========================================================
open_questions_tbd: []
