# Specs/Defense/L1/runtime/open_questions.yaml
# Defense Runtime Open Questions (Unified Decision Table)
# v1.0.0 — SDD 개발 착수 전, 모든 TBD를 한 곳에서 결정/관리하기 위한 SSOT
#
# 작성 기준:
# - 현재 대화에서 확정/작성된 문서들의 open_questions_tbd 항목을 통합했다.
# - MVP 결정이 이미 내려진 항목은 status=DECIDED로 표시했다.
# - deadline은 “개발 착수 전(=문서 완결 후)” 기준으로 2026-03-09로 잡았다(Asia/Seoul).

meta:
  doc_id: "runtime_open_questions"
  title: "Open Questions (TBD) — Decision Table"
  version: "1.0.0"
  updated_at: "2026-03-08"
  timezone: "Asia/Seoul"
  owner_team: "defense-runtime"
  status: "active"
  rule:
    - "MVP 개발 착수 전, status=OPEN 항목은 전부 DECIDED로 전환되어야 한다."
    - "결정 완료 후, 관련 SSOT(L0/L1/L2/Policy/Annex)에 반영하고 링크를 업데이트한다."

mvp_decisions_locked:
  # 사용자가 확정한 3개 결정 + 내가 정합성 맞게 확정한 1개(Throttle scope)
  decisions:
    - id: "LOCK-1"
      topic: "S3 gate(428) 집행 경계"
      decision: "Envoy ext_authz deny로 처리(428 + CHALLENGE_REQUIRED + x-defense-*)"
      affects:
        - "L1/runtime/actuators.yaml (CHALLENGE_S3 gate_execution)"
        - "L1/runtime/contracts.yaml (deny 428)"
        - "L1/runtime/logic.yaml (REQUIRE_S3)"
      status: "DECIDED"
    - id: "LOCK-2"
      topic: "Policy 로드 방식(MVP 및 운영 확장성)"
      decision: "Redis 로드로 고정(tm:policy:* 키). 파일 로드는 개발 편의용 fallback만 허용"
      affects:
        - "policy/policy_v1.yaml (storage_contract)"
        - "L2/optimization/defense_policy_optimization_ssot.yaml (activation)"
      status: "DECIDED"
    - id: "LOCK-3"
      topic: "Throttle read endpoint prefix (MVP 기본 allowlist)"
      decision: >
        include_path_prefixes는 아래로 확정하고, write/결제/홀드/방어 엔드포인트는 exclude로 유지.
        include: [/api/catalog, /api/events, /api/queue, /api/sections, /api/blocks, /api/areas, /api/seatmap, /api/seats, /api/availability, /api/recommend, /api/search]
        exclude: [/api/hold, /api/order, /api/payment, /api/confirm, /defense/challenge, /health]
      affects:
        - "policy/policy_v1.yaml (parameters.throttle.scope)"
        - "L1/runtime/actuators.yaml (endpoint_scoping)"
      status: "DECIDED"

